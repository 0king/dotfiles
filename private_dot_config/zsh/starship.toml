format = """$username$hostname${custom.home}$directory
($all
)$character"""

[line_break]
disabled = true

[custom.home]
when = 'test "$PWD" = "$HOME"'
command = 'icon=$(uname -s | grep -q Darwin && echo "" || (test -f /etc/os-release && . /etc/os-release && case $ID in ubuntu) echo "";; arch) echo "";; debian) echo "";; fedora) echo "";; *) echo "";; esac || echo "🐧")); printf "%s %s@%s:~" "$icon" "$USER" "${HOSTNAME:-$(hostname)}"'
format = "[](#C2410C)[ $output ](bold white bg:#C2410C)[](fg:#C2410C) "

[directory]
truncation_length = 0
truncate_to_repo = false
format = "([](#C2410C)[ $path ](bold white bg:#C2410C)[](fg:#C2410C) )"
repo_root_format = """[](#C2410C)[ $repo_root$read_only ](bold white bg:#C2410C)[](fg:#C2410C)
[$before_root_path$repo_root$path]($before_repo_root_style) """
before_repo_root_style = "dimmed white"
repo_root_style = "bold white bg:#C2410C"

[directory.substitutions]
"~/" = "__STARSHIP_HOME_SLASH__/"
"~" = ""
"__STARSHIP_HOME_SLASH__/" = "~/"
